<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;">Cadastro de Usuário</h1>
    <p style="text-align: center;"> <small>Preencha todos os campos abaixo</small></p> <hr>

    <h2>Dados Pessoais</h2>

    <label for="campo_nome">Nome completo:</label><br>
    <input type="text" id="campo_nome" placeholder="Digite seu nome" required> <br><br>

    <label for="campo_email">E-mail:</label><br>
    <input type="email" placeholder="Digite seu e-mail" required><br><br>

    <label for="campo_senha">Senha:</label><br>
    <input type="password" name="" id="" placeholder="Digite sua senha" required><br><br>

    <label for="campo_idade">Idade:</label> <br>
    <input type="number" placeholder="Digite sua idade"><br><br><hr>

    <h2>Nível de Conhecimento</h2>
    <input type="radio" name="Nivel" id="iniciante"><label for="iniciante"> Iniciante</label><br>
    <input type="radio" name="Nivel" id="intermediário"><label for="Intermediário"> Intermediário</label><br>
    <input type="radio" name="Nivel" id="Avanaçado"><label for="Avançado"> Avançado</label><br><hr>

    <h2>Tecnologias de Interesse</h2>
    <input type="checkbox" name="linguagem" id="HTML">
    <label for="HTML">HTML</label><br>

    
    <input type="checkbox" name="linguagem" id="CSS">
    <label for="CSS">CSS</label><br>

    
    <input type="checkbox" name="linguagem" id="JavaScript">
    <label for="JavaScript">JavaScript</label><br>

    
    <input type="checkbox" name="linguagem" id="Python">
    <label for="Python">Python</label><br>

    
    <input type="checkbox" name="linguagem" id="Java">
    <label for="Java">Java</label><br><br><hr>

    <h2>Linguagem Favorita</h2>
    <select name="" id="">
        <option selected disabled value="Selecione uma linguagem">Selecione uma linguagem</option>
        <option value="HTML">HTML</option>
        <option value="Python">Python</option>
        <option value="Java">Java</option>
        <option value="JavaScript">JavaScript</option>
    </select>  <br><br><hr>
   

    <h2>Sobre Você</h2>
    <p>Fale um pouco sobre você: </p>
    <textarea rows="7" cols="40" placeholder="Escreva aqui..."></textarea><br><br>
    <button>Cadastrar</button> <hr>
    <small>Seus dados estão seguros conosco.</small>



</body>
</html>
